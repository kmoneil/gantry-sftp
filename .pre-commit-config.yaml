# Python tools are LOCAL hooks calling .venv/bin/*, so their versions track uv.lock rather
# than a mirror repo that drifts from it. `pre-commit autoupdate` bumps the upstream repos
# below; the local ones move when `uv lock` moves.
#
# Install once:  .venv/bin/pre-commit install
# Never commit with --no-verify.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      # Golden frames are binary fixtures captured from a real server; they are the point,
      # not an accident, so they are exempt from the "did you mean to commit this?" check.
      - id: check-added-large-files
        args: [--maxkb=512]
        exclude: ^tests/fixtures/.*\.bin$

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: .venv/bin/ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff (format)
        entry: .venv/bin/ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # mypy and ty are both scoped to `src` by pyproject. Passing filenames would drag in
      # tests/ and examples/, which are deliberately exempt -- so both run project-wide and
      # ignore the staged file list.
      - id: mypy
        name: mypy --strict (src)
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: ty
        name: ty (src)
        entry: .venv/bin/ty check
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: complexipy
        name: complexipy (cognitive complexity <= 15)
        entry: .venv/bin/complexipy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      # Deprecation lane -- NOT a third type gate. `pyrightconfig.deprecations.json` turns
      # typeCheckingMode off and leaves exactly one rule on, so this fails a commit only for
      # calling something a stub marks @deprecated (PEP 702). It is separate from
      # `[tool.pyright]`, which stays IDE-alignment-only, because pyright's standard mode
      # reports errors in fsspec.py that come from fsspec shipping no types.
      #
      # It is here because it is the only checker in this repo that can currently see the
      # `@contextmanager` + `-> Iterator[T]` deprecation: pyright's bundled typeshed carries
      # the overload pair, mypy's and ty's still carry the old single overload. Both of those
      # have the rule enabled in pyproject.toml too, so they take over when their typeshed
      # catches up -- this lane covers the gap, and covers the whole repo rather than just
      # `src`, since a deprecated spelling taught in an example gets copied into shipped code.
      - id: deprecations
        name: no deprecated APIs (basedpyright, reportDeprecated)
        entry: .venv/bin/basedpyright -p pyrightconfig.deprecations.json
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      # `UV_CACHE_DIR` is set because this repository's dev sandbox has a root-owned
      # `~/.cache/uv` that `uv` cannot write to. It used to name `/workspace/.uv-cache`, an
      # absolute path that exists only in that sandbox -- so the first CI run this project
      # ever had failed here, on a runner with no `/workspace` at all, with
      # `failed to create directory: Permission denied`. Same class as a docstring citing a
      # gitignored `_plans/` path: an environment-specific fact baked into a committed file.
      #
      # Relative, so it resolves against whatever the repository root is -- pre-commit runs
      # hooks from there. Writable in both places, gitignored, and never inside the sdist
      # because hatchling excludes what git ignores.
      - id: uv-lock
        name: uv lock is in sync with pyproject
        entry: env UV_CACHE_DIR=.uv-cache uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      # Invoked via `bash` rather than executed, so the hook that forbids the exec bit does
      # not need the exec bit itself and does not have to allowlist its own script.
      - id: forbid-exec-bit
        name: no executable bit in the git index
        entry: bash scripts/forbid_exec_bit.sh
        language: system
        pass_filenames: false

      # Runs on every file type rather than on Python, because a credential lands in a YAML, a
      # TOML or a Markdown snippet at least as easily as in a module.
      #
      # `.secrets.baseline` holds 22 entries and **every one was read before it was written**:
      # fixture passwords this suite greps for on purpose (`hunter2`,
      # `correct-horse-battery-staple`, `s3cret-that-must-not-be-in-argv`), bare PEM *header*
      # lines with no key material behind them, an environment variable's *name*, and an
      # OpenSSH "Permission denied (password)" string. No real credential is in it.
      #
      # The baseline is not a file-level exclusion and that is what makes it safe to have: it
      # is keyed by (file, hashed secret, line), so a genuine secret added to an
      # already-listed file still fails -- proved by dropping an AWS key into
      # `tests/test_fsspec.py`, which the hook refused with the baseline in place. Regenerate
      # with `.venv/bin/detect-secrets scan $(git ls-files) > .secrets.baseline` when a
      # fixture moves, and read the diff rather than trusting it.
      - id: detect-secrets
        name: no new secrets (detect-secrets)
        entry: .venv/bin/detect-secrets-hook --baseline .secrets.baseline
        language: system

      # The one hook here that reports instead of gating -- it always exits 0, and the reason
      # a parked worktree must not fail a commit is in the script's header. `verbose` is not
      # decoration: pre-commit shows the stdout of a *failing* hook only, so a hook that never
      # fails is silent without it, and this one would be installed and mute. `always_run`
      # because what it looks at is the worktree list, not the staged files.
      - id: parked-worktrees
        name: parked background-session worktrees (warns, never fails)
        entry: bash scripts/warn_parked_worktrees.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      # pytest is pre-push only: it is too slow for every commit, and the point of the gate
      # is that nothing broken leaves the machine. live-tests/ and benchmarks/ need
      # containers and a shaped link, and are excluded by pyproject's testpaths.
      - id: pytest
        name: pytest (unit + real sftp-server)
        entry: .venv/bin/python -m pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
