# Publish a release to PyPI, triggered by pushing a tag.
#
# **It has run**, for 0.1.0 on 2026-08-05 and 0.1.1 on 2026-08-06: verify, build, publish with
# attestations, announce. This header said the file had never run and cited a sentence in
# `ci.yml` that no longer exists -- a citation is only alive while the thing it points at is,
# and the one place that reads worst when it goes stale is a workflow nobody opens between
# releases.
#
# **There is no API token here and there must not be one.** This uses PyPI's trusted
# publishing (OpenID Connect): GitHub mints a short-lived token for this repository, this
# workflow and this environment, and PyPI verifies it. A long-lived `PYPI_API_TOKEN` in
# repository secrets is a credential that can be exfiltrated by any workflow that runs
# untrusted code -- and this project's whole argument is about not holding credentials it does
# not need to hold. The `id-token: write` permission below is what mints it, and it is granted
# to the publish job alone rather than to the workflow.
#
# One-time setup on PyPI, which cannot be done from here:
#   https://pypi.org/manage/account/publishing/ -> add a pending publisher
#     PyPI project name : gantry-sftp
#     Owner             : kmoneil
#     Repository        : gantry-sftp
#     Workflow          : release.yml
#     Environment       : pypi
# Then create a `pypi` environment in the repository settings. Protect it with a required
# reviewer if you want a human gate between the tag and the upload.
#
# Third-party actions are pinned to a commit SHA with the tag in a trailing comment, matching
# `ci.yml`, and for the reason stated there: a floating tag is a mutable reference to somebody
# else's code, and this one runs with permission to publish.

name: release

on:
  push:
    tags: ["v*"]
  # Deliberately available by hand too: a tag that failed to publish for an infrastructure
  # reason should not need a second tag to retry, since a version can only be uploaded once.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate first. Publishing is the one irreversible step in this project -- a
  # version number on PyPI cannot be reused, even after a delete -- so the full
  # suite runs against the tagged tree before anything is built for upload.
  #
  # **Every `uv` invocation here takes `--frozen`, and it is the reason this job
  # was edited.** It used to run a bare `uv sync --all-extras`, which is allowed
  # to re-resolve when the lock and `pyproject.toml` disagree -- so the one lane
  # that ends in an upload was the only one in the repository permitted to
  # install something `uv.lock` does not name, and `ci.yml` had `--frozen` on
  # all nine of its jobs. The hashes in the lock are only worth what the flag
  # that insists on them is worth.
  #
  # The `audit` lane runs here too, and this is the moment it matters most: a
  # published version is the one artifact that cannot be taken back, and its
  # shipped-surface scope is exactly the set a user of that artifact installs.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-client openssh-server
      - run: uv sync --frozen --all-extras --group audit
        # Skipped for the reason `ci.yml` gives at length: the parked-worktree hook asks about
        # worktrees a background session left on a developer's machine, and a runner's fresh
        # checkout can never have one. Set in both workflows so the two spellings of "run the
        # gates" do not disagree about which hooks that means.
      - run: uv run --frozen python scripts/lanes.py gates
        env:
          SKIP: parked-worktrees
      - run: uv run --frozen python scripts/lanes.py fast
      - run: uv run --frozen python scripts/lanes.py audit

      # **The long lanes run here rather than per push** (D-159). `ci.yml` moved `benchmarks`
      # to the weekly schedule because a ~29 minute job whose output is a gitignored report is
      # not a question any single push needs answered -- but a release is the one step that
      # cannot be taken back, and this lane found a bug that had been live for two releases
      # (D-152) the first time it was ever allowed to finish. `iproute2` is for the shaped-link
      # rows; without it they skip with a reason rather than failing.
      #
      # `mutation` is deliberately **not** here. It takes over 45 minutes, has never once run to
      # completion (D-154), and cannot gate anyway: `mutmut run` exits 0 whether or not mutants
      # survive, and the register it would be diffed against lives in the gitignored `_plans/`.
      # Adding it would put an unbounded, non-gating job in front of the one irreversible step.
      - run: sudo apt-get install -y --no-install-recommends iproute2
      - run: uv sync --frozen --all-extras --group audit --group bench
      - run: uv run --frozen python scripts/lanes.py benchmarks

  # ---------------------------------------------------------------------------
  # Build once, publish that artifact. Building separately in the publish job
  # would upload something no test has seen.
  #
  # `--no-build-isolation` over a synced `build` group, rather than the default,
  # and the default is what it looks like it is: PEP 517 resolves
  # `[build-system] requires` fresh from PyPI into a throwaway environment, so
  # the backend that *produces* the artifact was the last thing in this path
  # arriving unpinned and unhashed. With the group synced it comes from
  # `uv.lock` like everything else. The two builds were compared before this
  # line was written -- same 48 entries, byte for byte identical -- so what
  # changed is where hatchling came from and nothing else.
  # ---------------------------------------------------------------------------
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --frozen --group build

      - name: Refuse a tag that disagrees with the packaged version
        # The version is single-sourced from `src/gantry_sftp/__init__.py`, so a `v0.1.1` tag on
        # a tree that still says `0.1.0` would publish 0.1.0 a second time and fail at the
        # upload -- after the suite had passed, which reads as an infrastructure problem. Caught
        # here instead, where the message names the actual mistake.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          packaged="$(uv run --frozen python -c 'import gantry_sftp; print(gantry_sftp.__version__)')"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tagged" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match __version__ ${packaged}" >&2
            exit 1
          fi

      - name: Refuse a tag whose changelog section is still 'Unreleased'
        # `tests/test_packaging.py` accepts either a `## <version>` heading or `## Unreleased`,
        # because before the first tag the honest answer is the second one -- and a dated
        # heading for a release nobody can install is the failure that check exists to prevent.
        # Tagging is the moment that stops being true, and it is the only moment: nothing a
        # commit-time hook can see distinguishes "not released yet" from "forgot to write it up".
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## ${version}( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## ${version}' section; rename '## Unreleased' and date it" >&2
            exit 1
          fi

      - run: uv build --no-build-isolation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution
          path: dist/

  # ---------------------------------------------------------------------------
  # The only job that can publish, and the only one holding `id-token: write`.
  # ---------------------------------------------------------------------------
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # mints the OIDC token trusted publishing verifies; nothing else needs it
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distribution
          path: dist/
      # `attestations: true` restates this action's own default, which is normally noise -- and
      # here it is the one line a documented decision rests on (D-149). `docs/security.md`
      # declines to ship an SBOM, and its argument is that for "was this artifact built by the
      # project it claims to come from" a signed PEP 740 attestation is the stronger answer and
      # is already uploaded. That reasoning is only sound while the attestation is actually
      # produced.
      #
      # Two things make the default too thin to rest on. The action labels the input
      # `[EXPERIMENTAL]` in its own `action.yml` -- read at the pinned SHA, not recalled -- and
      # an experimental default is one that can move. And a default nobody wrote down is one a
      # future edit can turn off without anything reading as changed. Written out, `tests/
      # test_lanes.py` can pin it, so removing it fails a test that names the page it breaks.
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          attestations: true

  # ---------------------------------------------------------------------------
  # The GitHub release, after the upload rather than before it. A release object
  # pointing at a version that failed to publish is worse than none: it is the
  # page people link to, and it would claim something exists on PyPI that does
  # not.
  #
  # **The notes come out of `CHANGELOG.md` rather than being written again.** The
  # changelog already has to carry a section for this version -- `build` refuses
  # the tag otherwise -- so a second hand-maintained copy would be a second place
  # to forget, and the two would drift in the direction nobody notices.
  #
  # `contents: write` is granted here and nowhere else in this file. The
  # workflow's default is `contents: read`.
  # ---------------------------------------------------------------------------
  announce:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distribution
          path: dist/
      - name: Create the release from this version's changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # From the heading for this version to the next `## ` heading, exclusive. The same
          # section `build` has already checked exists, so this cannot come back empty.
          awk -v want="## ${version}" '
            index($0, want) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no changelog section for ${version}; refusing to publish empty notes" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
