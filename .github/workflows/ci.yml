# Continuous integration for gantry-sftp.
#
# **It ran for the first time on 2026-08-05**, and the first run was worth the wait: it found a
# benchmark lane broken for two releases by a signature change nothing type-checked (D-152), a
# leak detector blaming 140 tests that had not leaked (D-153), two hook scripts shipping to PyPI
# without the config that invokes them, a filesystem that will not hold the filenames a whole
# test axis is built on (D-150), and a security control dead on Windows (D-156). None of it was
# visible to any gate that runs on a developer's machine.
#
# This header used to say the file had never run and explain why it was committed anyway. That
# argument held -- writing down which lane runs where is most of the work and needed no remote --
# and it is kept only as the reason the first run had this much to say.
#
# Every lane below is invoked through `scripts/lanes.py`, never by spelling out a pytest
# command here. Two spellings of "how this project runs its tests" is how the netem lane ends
# up with one set of flags locally and another in CI, and `tests/test_lanes.py` asserts that
# every lane the runner knows about is named in this file.
#
# Third-party actions are pinned to a commit SHA with the tag in a trailing comment. A
# floating tag is a mutable reference to somebody else's code with a token in scope; this
# project spawns `ssh` and handles credentials, so it does not get to be relaxed about that.
# Re-pin deliberately, reading the diff, rather than by moving the tag.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, for the lanes that are too slow to run per-change. Nothing here fails on a
    # schedule today, which was the defect this file exists to fix.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Static gates: ruff, mypy --strict, ty, complexipy, the uv.lock check, the exec bit.
  #
  # Linux only, and that is a property of `.pre-commit-config.yaml` rather than a shortcut:
  # its local hooks invoke `.venv/bin/ruff` and friends by path, and Windows puts them in
  # `.venv\Scripts`. Running them anywhere else would need a second spelling of the gate
  # list, which is the thing this file is trying not to have. Nothing these tools check is
  # platform-dependent -- `src` has no `sys.platform` branch that narrows a type.
  # ---------------------------------------------------------------------------
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
        # `SKIP` is pre-commit's own mechanism, read from the environment. The parked-worktree
        # hook looks for worktrees left under `.claude/worktrees/` by a background session on a
        # developer's machine; a runner checks out a fresh tree and can never have one, so the
        # hook is asking a question whose answer here is always "none". It is the one hook in
        # the config that is about the *developer's* workflow rather than about the code.
      - run: uv run --frozen python scripts/lanes.py gates
        env:
          SKIP: parked-worktrees

  # ---------------------------------------------------------------------------
  # Known advisories against the versions `uv.lock` pins. Two scopes with two verdicts --
  # what a user installs gates, what a developer installs reports -- and the argument for
  # that split is in `scripts/audit_deps.py`'s header rather than repeated here.
  #
  # **The `schedule:` trigger is most of this job's value**, which is not true of any other
  # job in this file. An advisory is published against code that has not changed, so a lane
  # that ran only per change would find it whenever somebody next happened to edit
  # something. It is deliberately not behind an `if:` for that reason: per change *and*
  # weekly.
  #
  # It needs network by definition, and that is the one prerequisite here that is not
  # `apt-get install`-able. A run that cannot reach the advisory service exits 2 -- neither
  # a pass nor a finding -- rather than reporting a clean tree, so this job going red can
  # mean PyPI is down. That is the intended behaviour and the output says which it was.
  # ---------------------------------------------------------------------------
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --group audit
      - run: uv run --frozen python scripts/lanes.py audit

  # ---------------------------------------------------------------------------
  # The fast lane on the two platforms this library supports. Both gate.
  #
  # Windows was the third row here until D-158 moved it to `fast-windows` below, on the weekly
  # schedule. The short version: transfers are POSIX-only by design, so the platform gets the
  # codec, the transport and the remote-only operations and none of the four things anybody
  # installs this for. The long version is in that job's own block.
  #
  # macOS gates and is worth the minute. It differs from Linux in two ways this library cares
  # about and neither is exotic: APFS refuses a filename that is not valid UTF-8 (D-150), and it
  # folds case, so the destination-collision checks D-37 built meet the real hazard rather than
  # a hard link standing in for it. Both were found here on the first run.
  # ---------------------------------------------------------------------------
  fast:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/lanes.py fast

  # ---------------------------------------------------------------------------
  # Windows, weekly rather than per change -- and that is a statement about the
  # library rather than about the cost of the job (D-158).
  #
  # The data path is POSIX-only by design (D-82): `get` / `put` / `get_tree` /
  # `put_tree` refuse on a platform without `os.pread` and `os.pwrite`, which is
  # every Windows. What works there is the codec, the transport and the
  # remote-only operations. For a file-transfer library that is the product
  # minus the product, so Windows is not a supported platform today and a
  # per-change gate would be gating a thing nobody can use yet.
  #
  # It is not deleted, because the evidence is worth having and was expensive to
  # get: the first Windows run this project ever completed is what found D-156,
  # a security control that refuses every connection there. Weekly keeps that
  # channel open at no per-push cost and with no red row on somebody's commit --
  # which is the failure D-152 describes, where a lane whose colour means
  # "somebody pushed" stops being read.
  #
  # `continue-on-error` stays until Windows is a platform this library claims.
  # Flipping it is D-158's closure condition, not a tidy-up.
  # ---------------------------------------------------------------------------
  fast-windows:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/lanes.py fast

  # ---------------------------------------------------------------------------
  # The same unit tests again with the resource-leak check armed (D-115). A separate job
  # rather than a flag on `fast`, because two passes over `gc.get_objects()` per test cost
  # more as the heap grows and the gating lane should stay under a minute.
  # ---------------------------------------------------------------------------
  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/lanes.py leaks

  # ---------------------------------------------------------------------------
  # A real sshd on localhost. Linux only for now: the harness probes for its binaries and
  # validates its sshd config with `sshd -t` rather than assuming either, so it may well run
  # on macOS -- but "may well" is not a lane, and adding a runner is cheap once there is a
  # remote to run it on.
  # ---------------------------------------------------------------------------
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/lanes.py live

  # ---------------------------------------------------------------------------
  # The server matrix: the same client against OpenSSH, asyncssh and paramiko. It needs the
  # `bench` group, which is deliberately not installed by default -- paramiko and asyncssh
  # drag in `cryptography`, and a default install that pulled it in would make the
  # no-cryptography claim harder to check than it should be. Hence its own job.
  # ---------------------------------------------------------------------------
  server-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: uv python install
      - run: uv sync --frozen --group bench
      - run: uv run --frozen python scripts/lanes.py matrix

  # ---------------------------------------------------------------------------
  # The one performance lane that runs per change, and the reason it can is that it counts
  # work rather than timing it: the same transfer retires the same instructions and reaches
  # the same peak resident set whoever else is on the runner, so this is the only lane here
  # whose numbers a shared host does not move. It needs no `bench` group -- it measures us,
  # over `sftp-server` on a pipe.
  #
  # The committed baseline is per architecture and per CPython patch release, and this runner
  # is neither the one it was taken on. That half therefore reports rather than gates until
  # somebody generates an x86_64 baseline here; the *shape* half -- cost per byte must not
  # grow with the file -- needs no baseline and gates everywhere. The report says in one line
  # which of the two ran, so a lane that could not compare says so instead of passing quietly.
  # ---------------------------------------------------------------------------
  cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y openssh-server valgrind
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/lanes.py cost

  # ---------------------------------------------------------------------------
  # Measuring lanes. Not on pull requests: a shared runner's throughput varies with whoever
  # else is on the host, and both of these compare ratios of measured throughput. They run on
  # demand and weekly, and they report -- `scripts/lanes.py` records why each one does not
  # gate, so the reason lives next to the lane rather than only here.
  #
  # netem shapes loopback with `tc`, which needs CAP_NET_ADMIN; hosted runners have
  # passwordless sudo, and the lane probes by adding a real qdisc rather than by reading
  # /proc/self/status, so it will say precisely what is missing if this is wrong.
  # ---------------------------------------------------------------------------
  netem:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y openssh-server iproute2
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/lanes.py netem

  benchmarks:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y openssh-server iproute2
      - run: uv python install
      - run: uv sync --frozen --group bench
      - run: uv run --frozen python scripts/lanes.py benchmarks

  # ---------------------------------------------------------------------------
  # The mutation lane. Minutes rather than seconds, so it is weekly and on demand rather than
  # per-change. It cannot gate yet: `mutmut run` exits 0 whether or not mutants survive, and
  # the register of known-equivalent survivors is in the gitignored `_plans/` tree, so there
  # is nothing committed for a machine to diff a run against. `mutmut results` is printed so
  # a human can do the diff until there is.
  # ---------------------------------------------------------------------------
  mutation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A starved job and a hung one produce the same message without this, which is most of why
    # D-154 took three runs to characterise.
    #
    # **45 rather than the 30 this started at, and the first value was wrong for an instructive
    # reason.** 30 was derived by extrapolating from the rate before the run died -- but the run
    # died at the memory bomb, and every mutant after it was unmeasured. With the ceiling in
    # place the lane reached 8065 of 8548 in 30 minutes and hit this instead, so the real figure
    # is ~32 and the extrapolation was reading half a curve. 45 leaves room for a slower runner
    # without leaving a hang to sit for an hour.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen
      # **The lane has never produced a verdict here** (D-154). Three runs died at 4350, 4350
      # and 4363 of 8548 mutants -- within thirteen of each other, about half the workload,
      # ~11-12 minutes in -- always with `The runner has received a shutdown signal`, which is
      # what a dead VM looks like from inside the job. That tightness rules out random
      # infrastructure reclaim; something crosses a threshold at a repeatable point.
      #
      # Two candidates measured and ruled out before adding this: the log is 13502 lines and
      # 923 KB, which is nothing, and `mutants/` is 44 MB against ~14 GB free. That leaves
      # memory, which cannot be measured from outside the runner -- so the job measures itself.
      #
      # The sampler writes to **stdout** rather than a file on purpose. If the VM is killed the
      # file dies with it, and the evidence we want is the last reading before the kill; a
      # streamed line is already in GitHub's log by then. Prefixed so it can be grepped out of
      # mutmut's own progress.
      - name: mutation lane, sampling memory as it goes
        run: |
          ( while sleep 15; do
              printf 'D154-USAGE %s mem_avail_mb=%s disk_avail_mb=%s\n' \
                "$(date -u +%H:%M:%S)" \
                "$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)" \
                "$(df -m --output=avail / | tail -1 | tr -d ' ')"
            done ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          uv run --frozen python scripts/lanes.py mutation
      - run: uv run --frozen mutmut results
