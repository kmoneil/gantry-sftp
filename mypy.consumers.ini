# The type gate for the two directories that consume the public API the way a user does.
#
# **A separate file rather than more entries under `[tool.mypy]` in pyproject.toml** (D-152),
# for the reason `pyrightconfig.deprecations.json` is separate: the settings here are *weaker*
# than the `src` gate's, and putting both in one table is how a weakening leaks onto `src/` --
# the one thing this must not do. It is also the only way to address these directories at all,
# since `live-tests` is not a legal module name and a `[[tool.mypy.overrides]]` pattern cannot
# name it.
#
# **Why these two and not `tests/`.** `benchmarks/` and `live-tests/` call `get`, `put`,
# `open_session` and `connect` exactly as a downstream program does, so a signature change that
# breaks them is a signature change that breaks users. `tests/` asserts against internals and is
# a different argument, deliberately not bundled in here.
#
# **Why not `strict`, measured rather than assumed.** Under `strict` these report 59 and 258
# errors, and almost all of them are `no-untyped-def` and `explicit-override` on test functions
# -- house style for assertion code, not contract breaks. The default level plus the codes below
# reports the ones that matter: on its first run it found `_transport() -> object`,
# `connect_kwargs() -> dict[str, object]`, a third `-> object` returning something every caller
# uses as an `async with`, a `Transport` read for a `SubprocessTransport` attribute, two
# discarded anyio task handles, and a lambda whose signature could not be inferred.
#
# **Run once per directory, not over both.** Each holds a `conftest.py`, and two files claiming
# the top-level module name `conftest` is an error mypy raises before it checks anything. The
# `MYPYPATH` differs too: `benchmarks/` imports `sshd` and `netem` out of `live-tests/`, and
# `live-tests/` imports `server_contract` out of `tests/`.
[mypy]
python_version = 3.13
python_executable = .venv/bin/python

# An ignore that has stopped being needed is a claim about the code that is no longer true, and
# three of them were already stale here when this gate was written -- the `arg-type` waivers on
# `connect(**connect_kwargs(...))`, which the `ClientKwargs` TypedDict retired.
warn_unused_ignores = True

# `deprecated` for the reason CLAUDE.md gives (D-108): writing a dated API is taking on a
# migration and hiding it, and that applies to a benchmark harness as much as to `src/`. The
# other two are the house conventions that already hold in `src/`.
enable_error_code = unused-awaitable, ignore-without-code, deprecated

# paramiko and asyncssh are the competitor stack, installed only by the `bench` group -- and
# that group is separate precisely because they pull in the Python cryptography this library
# exists not to need. So on a default `uv sync` they are absent and mypy reports
# `import-not-found`; with `--group bench` synced they are present without stubs and it reports
# `import-untyped`. **A gate whose verdict depends on which group somebody last synced is a gate
# that lies**, and neither answer is about our code. `types-paramiko` would fix only the second
# spelling, and only for whoever installed it.
[mypy-paramiko,paramiko.*]
ignore_missing_imports = True

[mypy-asyncssh,asyncssh.*]
ignore_missing_imports = True

# fsspec ships no `py.typed` and has no stubs on PyPI. Same decision and the same reason as the
# `[[tool.mypy.overrides]]` block for it in pyproject.toml: the fix is upstream, in a package we
# do not control. Remove both when fsspec ships the marker.
[mypy-fsspec,fsspec.*]
ignore_missing_imports = True
