[project]
name = "gantry-sftp"
# Single-sourced from the package, so `gantry_sftp.__version__` and the installed
# distribution cannot name different releases in the same bug report. See
# `[tool.hatch.version]` below and `tests/test_packaging.py`, which asserts they agree.
dynamic = ["version"]
description = "A modern Python SFTP library that does not implement SSH at all."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
# The SPDX expression alone puts `License-Expression: Apache-2.0` in METADATA and ships no
# grant text at all -- measured on a real build. Apache-2.0 section 4(a) requires the copy to
# travel with the distribution, and a corporate compliance scan looks for the file, not the
# identifier.
license-files = ["LICENSE"]
authors = [{ name = "Kevin O'Neil", email = "kevin@oneil.xyz" }]
keywords = ["sftp", "ssh", "filexfer", "openssh", "file-transfer"]
# `Operating System :: POSIX` is a scope statement, not an omission. The data path places
# every payload with `os.pwrite` and reads with `os.pread`, both documented Unix-only, and
# `preserve_times` stamps a descriptor rather than a path -- so transfers cannot run on
# Windows and refuse there rather than crashing. The `ssh` transport and every remote-only
# operation are platform-independent; see README "Requirements" and `session/_platform.py`.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: File Transfer Protocol (FTP)",
  "Typing :: Typed",
]
dependencies = [
    "anyio>=4.14.2",
]

# The adapter in `gantry_sftp.fsspec`, and the only optional dependency this project has.
#
# **The floor is the version it was verified against, not the oldest that works**, and that is
# a deliberate difference from an ordinary lower bound. The adapter reads fsspec *internals*
# rather than API -- `known_implementations`, the `_Cached` metaclass's tokenizing,
# `_strip_tokenize_options`, `to_json`'s `include_password` default -- because that is what
# displacing a registered protocol and keeping a credential out of a pickle require. Every one
# of those was re-probed against 2026.7.0 in the same change (`_plans/probes/`), and a claim
# about an untested older version would be exactly the "recalled from memory" defect this repo
# refuses elsewhere. Raise the floor when the probes are re-run against something newer.
[project.optional-dependencies]
fsspec = [
    "fsspec>=2026.7.0",
]

# The repository exists as of 0.1.0, so these come back -- they were absent until then because
# METADATA advertising a Homepage that 404s is the same defect as a docstring pointing at a
# gitignored file: a reader is told where to go and cannot get there.
#
# `Changelog` is listed because PyPI renders it as its own link on the project page, and a
# release without a reachable changelog makes every user diff two sdists to find out what moved.
[project.urls]
Homepage = "https://github.com/kmoneil/gantry-sftp"
Source = "https://github.com/kmoneil/gantry-sftp"
Issues = "https://github.com/kmoneil/gantry-sftp/issues"
Changelog = "https://github.com/kmoneil/gantry-sftp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/gantry_sftp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gantry_sftp"]

# What the source distribution carries, decided rather than defaulted. Hatchling's default is
# "everything git does not ignore", which measured out as the whole working tree -- including a
# `.complexipy_cache/` that had been shipping unnoticed, which is the same class of silent
# packaging defect as the missing licence text `tests/test_packaging.py` exists for.
#
# `tests/` and `examples/` stay in, and the reason is downstream packagers: Debian, Fedora and
# conda-forge rebuild from the sdist and run the suite to validate the build. `examples/` is
# tested documentation and carries its own README.
#
# `benchmarks/` is excluded, and the case is not aesthetic. No packager runs benchmarks; it
# needs `paramiko` and `asyncssh` to do anything, which is the Python cryptography this library
# exists not to need; it needs `openssh-server` and `CAP_NET_ADMIN` besides; and it is not even
# self-contained, since `_clients.py` imports `sshd` from `live-tests/`. A shipped directory
# that cannot run is worse than an absent one. It stays in the repository, in CI, and gating --
# what changes is only that it is not part of what a user receives.
#
# The repository furniture goes for the same reason: a CI workflow, a pre-commit config and the
# deprecation lane's pyright config describe how this project is developed, not what was
# installed. `.gitignore` is *not* in the list because hatchling force-includes it whatever the
# excludes say -- tried both spellings and measured the tarball -- and a line that does nothing
# is worse than an absent one.
[tool.hatch.build.targets.sdist]
exclude = [
  "benchmarks",
  ".github",
  ".pre-commit-config.yaml",
  "pyrightconfig.deprecations.json",
  ".complexipy_cache",
  ".hypothesis",
  ".pytest_cache",
  ".ruff_cache",
  "mutants",
]

# The shipped dependency is anyio and nothing else. The codec layer has no runtime
# dependencies at all and that is load-bearing, not an accident -- see DESIGN.md 4.1.
#
# `bench` is the comparison libraries and it is deliberately NOT in dev, and deliberately
# not in `[tool.uv] default-groups` either. paramiko and asyncssh drag in `cryptography`,
# `pynacl` and `bcrypt` -- Python cryptography is precisely the thing this project exists
# not to need, and a default `uv sync` that installed it would make the claim harder to
# check than it should be. `uv sync --group bench` when you want to run `benchmarks/`;
# without it, those rows skip with that exact line as the reason.
#
# It buys more than benchmark clients now: both libraries ship an SFTP *server* too, so
# `live-tests/matrix.py` gets two more implementations to measure our client against without
# needing Docker. Same group, same skip-with-a-reason rule.
[dependency-groups]
bench = [
    "asyncssh>=2.19",
    "paramiko>=3.5",
]
# `audit` is `scripts/audit_deps.py`'s tool, and it is its own group for the reason `bench`
# is: pip-audit costs 18 packages over a default `uv sync` -- itself and 17 others, among
# them `requests`, `urllib3`, `certifi`, `cyclonedx-python-lib` and `pip` itself -- which is
# a third again as many as the whole default lane installs, for something one lane runs. It
# does *not* pull `cryptography`, which was measured against this lock rather than assumed,
# because that is the one dependency this project cannot quietly acquire.
#
# The floor is 2.10 because that is what the two behaviours the script depends on were
# probed against: `--format json` emits `{"dependencies": [...], "fixes": []}` with a
# `skip_reason` on anything it could not audit, and a *failure* to reach the advisory
# service exits non-zero with **empty stdout** rather than with an empty finding list. That
# second one is load-bearing -- it is the only thing separating "nothing is wrong" from
# "nothing was checked", and `audit_deps.py` routes on it.
audit = [
    "pip-audit>=2.10",
]
# `build` exists so that the build backend comes out of `uv.lock` like everything else.
#
# `[build-system] requires` is the one dependency declaration in this file that `uv.lock`
# does not cover: PEP 517 build requirements are resolved fresh, from PyPI, in an isolated
# environment, every time anything builds this project -- so the code that produces the
# artifact users install was the last unpinned, unhashed thing in the release path, after
# `--frozen` closed the others. `release.yml` syncs this group and builds with
# `--no-build-isolation`, which makes hatchling arrive hashed from the lock.
#
# It has to agree with `[build-system] requires` above, and `tests/test_packaging.py`
# asserts that rather than trusting it: a `build` group that has drifted from the real build
# requirement produces a build that either fails or quietly re-resolves, and the second one
# looks exactly like this working.
build = [
    "hatchling>=1.27",
]
# fsspec is in `dev` rather than in a group of its own, which is the opposite call from
# `bench` and for the reason `bench` states: fsspec is pure Python with **no required
# dependencies at all** (measured -- every entry in its METADATA is behind an extra), so
# installing it does not drag in the cryptography this project exists not to need. It is
# `paramiko` that fsspec's own `sftp` extra pulls, and we install neither. The consequence
# that matters is that the adapter's tests run in the default lane instead of skipping, which
# is what DoD 1 asks for a shipped surface.
dev = [
  "fsspec>=2026.7.0",
  "pytest>=8.3",
  "hypothesis>=6.112",
  "ruff>=0.14",
  "mypy>=1.13",
  "ty>=0.0.1a10",
  "complexipy>=3.0",
  "pre-commit>=4.0",
  "mutmut>=3.2",
  "trio>=0.33.0",
  "basedpyright>=1.39.9",
  "detect-secrets>=1.5.0",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",     # pycodestyle
  "F",          # pyflakes
  "I",          # isort
  "N",          # pep8-naming
  "UP",         # pyupgrade
  "B",          # bugbear
  "A",          # builtins shadowing
  "C4",         # comprehensions
  "C90",        # mccabe -- distinct ceiling from complexipy's cognitive one
  "DTZ",        # naive datetimes
  "T20",        # no print in shipped code
  "PT",         # pytest style
  "RET",        # return simplification
  "SIM",        # simplify
  "SLF",        # private member access
  "TID",        # tidy imports
  "PTH",        # pathlib over os.path
  "ERA",        # commented-out code
  "PL",         # pylint
  "TRY",        # exception antipatterns
  "RUF",
  "S",          # bandit
  "ASYNC",      # async antipatterns
  "D",          # pydocstyle -- Google convention
  "ANN",        # annotations required
]
ignore = [
  "D105",    # magic method docstrings
  "D107",    # __init__ docstring -- documented on the class
  "TRY003",  # long messages outside exception class: our errors carry state, see DESIGN.md 9
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# PLR0913's default of 5 assumes positional arguments, where arity really is a complexity
# signal. Our connection entry points are keyword-only pass-throughs over independent ssh
# concepts -- host, user, port, config file, identity file, options, subsystem, executable,
# environment -- and bundling them into a parameter object would move the same fields
# somewhere else rather than remove any. 10 is a project-wide policy, not a per-function
# exemption; a function that wants more than that is genuinely doing too much.
max-args = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-pytest-style]
# PT011 wants a `match=` on broad exception classes. Our convention is stronger and this
# rule cannot see it: every `pytest.raises` is followed by `exc.value.args[0] == "..."`,
# which pins the whole message rather than a substring of it. Requiring `match=` as well
# would mean asserting the same string twice, in two spellings, and mutation survivors
# cluster on the half nobody updates.
raises-require-match-for = []
# PT030 is the same rule for warnings, declined for the same reason: the
# DeprecationWarning text is asserted in full right after the block.
warns-require-match-for = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
# Tests, examples, live-tests and benchmarks are exempt from docstring and
# annotation gates, and from bandit's assert/subprocess rules. They are NOT
# exempt from correctness lints.
# `scripts/` is developer tooling rather than shipped code, and the lane runner inverts
# T20: printing the table *is* what it does, so "no print" would be a rule against the
# program. S603 goes with it -- it spawns the lane's tool by resolved absolute path with a
# list argv and no shell, which is the checked-for property rather than the flagged one.
# Docstrings and annotations are NOT exempt here, unlike tests/: scripts/ is small enough
# that there is no reason for it to be the one unannotated corner.
"scripts/**" = ["T20", "S603"]
"tests/**" = ["D", "ANN", "S101", "S603", "S607", "PLR2004", "T20"]
"live-tests/**" = ["D", "ANN", "S101", "S603", "S607", "PLR2004", "T20"]
"benchmarks/**" = ["D", "ANN", "S101", "S603", "S607", "PLR2004", "T20"]
"examples/**" = ["D", "ANN", "S101", "S603", "S607", "PLR2004", "T20"]

# The password lane's fixtures *are* passwords: a test proving that a secret never reaches
# argv has to contain the secret it searches for, and the captured stderr fixtures are lines
# with the word "password" in them. Listed file by file rather than added to the directory
# globs above, because S105/S106 are worth keeping everywhere else -- an unexplained
# credential literal in any other test is still something to look at twice.
"tests/test_askpass.py" = ["S105", "S106"]
"tests/test_diagnosis.py" = ["S105"]
# Same reason one layer up: the fsspec adapter's whole credential argument is that a password
# reaches `__init__` and never `storage_options`, so the tests that prove it search `to_json()`
# and `__reduce__` for the literal they passed in.
"tests/test_fsspec.py" = ["S105", "S106"]
"tests/test_transport.py" = ["S105", "S106"]
# `connect()` forwards twelve values and the mutation lane cannot see one of them -- the
# function is `@asynccontextmanager`-decorated, so it generates no mutants at all (D-107).
# The hand-written table that replaces the lane has to pass a *non-default* for every
# argument or a forwarded one is invisible, and one of those arguments is the password.
"tests/test_namespace_and_connect.py" = ["S106"]
"live-tests/test_password_auth.py" = ["S105", "S106"]
"examples/password_auth.py" = ["S105", "S106"]
# Same shape again: the example's point is that this literal reaches the constructor and then
# appears in none of the four surfaces fsspec would otherwise serialise it into, so it has to
# be in the file to be searched for.
"examples/fsspec_urls.py" = ["S105", "S106"]

# ---------------------------------------------------------------------------
# mypy -- stricter of the two type gates, scoped to shipped code
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
files = ["src"]
python_version = "3.13"
python_executable = ".venv/bin/python"
warn_unreachable = true
disallow_any_explicit = false
enable_error_code = [
  "redundant-expr",
  "truthy-bool",
  "ignore-without-code",
  "unused-awaitable",
  "explicit-override",
  # PEP 702. Off by default in mypy, and it is the rule that turns "a checker somewhere
  # mentioned this" into a failed commit. It does not yet catch the `@contextmanager` +
  # `-> Iterator[T]` form -- mypy's bundled typeshed still declares `contextmanager` as one
  # un-deprecated overload -- which is why the basedpyright deprecation lane in
  # .pre-commit-config.yaml exists as well. Keep both: this one starts catching that form the
  # moment mypy vendors a newer typeshed, and it already catches everything else.
  "deprecated",
]

# fsspec ships no `py.typed` and has no stubs on PyPI, so `import fsspec` is an error under
# strict and its classes arrive as `Any`. **This one cannot be fixed at the source**, which is
# the bar CLAUDE.md sets before an ignore is allowed: the fix is upstream, in a package we do
# not control, and hand-writing stubs for `AbstractFileSystem` would be a layout recalled from
# memory -- the defect this repository refuses for wire formats, applied to an API.
#
# Scoped as narrowly as it can be. Only the missing-stub error is waived; the two classes that
# subclass an `Any` base carry an inline `# type: ignore[misc]` naming this same reason, so the
# debt is visible at the two places it is actually taken rather than only here.
#
# Remove both when fsspec ships `py.typed` -- and `useLibraryCodeForTypes` under
# `[tool.pyright]` below, which is the same decision taken for the same package in the third
# checker's spelling.
[[tool.mypy.overrides]]
module = ["fsspec", "fsspec.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# ty -- second type gate, same scope
# ---------------------------------------------------------------------------
[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python = ".venv"

# ty reports a deprecated call as a *warning*, and a warning does not fail `ty check`. A rule
# that reports without failing is a rule nobody reads, so it is escalated. Same typeshed gap as
# mypy's: this does not yet see the `@contextmanager` + `-> Iterator[T]` form.
[tool.ty.rules]
deprecated = "error"

# ---------------------------------------------------------------------------
# complexipy -- cognitive complexity (SonarQube S3776), distinct from mccabe
# ---------------------------------------------------------------------------
[tool.complexipy]
max-complexity-allowed = 15
paths = ["src"]

# ---------------------------------------------------------------------------
# pytest -- live-tests and benchmarks need containers and a shaped link, so they
# are out of the default run and are invoked explicitly.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# examples/ is in the default run on purpose: an example that has drifted out of sync with
# the library is a confident, wrong answer somebody will copy. Each one runs as a subprocess
# and skips cleanly without openssh-server.
testpaths = ["tests", "examples"]
# `tests/` on the path so `live-tests/` can import `server_contract` -- one contract asked of a
# fake here and of the matrix's three servers there, which is the whole point of D-114 and does
# not work if each lane keeps its own copy. Declarative rather than a `sys.path` insert walking
# up from `__file__`: that shape has broken three modules under mutmut already.
pythonpath = ["tests"]
# Setting norecursedirs REPLACES pytest's defaults rather than extending them, so the
# defaults are restated here. Dropping `.*` makes hypothesis warn that .hypothesis is
# being collected.
norecursedirs = [
  "*.egg",
  ".*",
  "_darcs",
  "build",
  "CVS",
  "dist",
  "node_modules",
  "venv",
  "{arch}",
  "live-tests",
  "benchmarks",
  "_plans",
]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "sftp_server: needs the OpenSSH sftp-server binary (ships in openssh-server)",
  # `slow` is descriptive, not excluded: these build the distribution and take seconds rather
  # than milliseconds, and they are in the default run because the defect they catch -- a wheel
  # with an SPDX identifier and no licence text -- is invisible to every other test here.
  "slow: builds a distribution; seconds rather than milliseconds",
]

# ---------------------------------------------------------------------------
# pyright / basedpyright -- IDE alignment only. NOT a committed gate.
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src"]
exclude = ["tests", "examples", "live-tests", "benchmarks", ".venv", "**/__pycache__"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
# fsspec ships no `py.typed`, and pyright's default is to infer types from an untyped package's
# *source* anyway. For a library annotated as thoroughly as fsspec is -- which is to say not at
# all -- that inference reads a parameter's default value as its declared type, and manufactures
# a contract the library does not have. It produced seven errors in `fsspec.py`, and all seven
# were checked against fsspec 2026.6.0's own source before this line was written:
#
#   - `get_file`/`put_file` take `callback=<NoOpCallback instance>`, so `NoOpCallback` was
#     inferred as the parameter type and any other `Callback` was an error. fsspec's own
#     `AbstractFileSystem.get` calls `self.get_file(..., callback=child)` with a *branched*
#     callback, so the library itself passes what pyright rejected.
#   - `AbstractBufferedFile.__init__` defaults `block_size="default"` and `cache_type=
#     "readahead"`, so passing the `int` its docstring asks for was an error. Its body reads
#     `self.DEFAULT_BLOCK_SIZE if block_size in ["default", None] else block_size`.
#   - `_upload_chunk`'s base body is a docstring and a comment, so its return was inferred
#     `None` and our `bool` was an incompatible override. Two shipped implementations,
#     `ftp.py` and `jupyter.py`, `return True` / `return False`.
#
# So: not seven findings, one -- an untyped dependency being treated as typed. PEP 561 says a
# package without `py.typed` is not typed, `[[tool.mypy.overrides]]` above already takes that
# position for the same package, and a checker that disagrees with the other two about the
# *same* dependency is a third opinion nobody can act on. The alternative was seven
# `# pyright: ignore` comments marking false positives as if they were debts.
#
# What it costs, stated rather than discovered: calls into fsspec are unchecked here, exactly
# as they already are under mypy. anyio ships `py.typed` and is unaffected -- measured, not
# assumed. Remove this when fsspec ships `py.typed`, together with the mypy override.
useLibraryCodeForTypes = false

# ---------------------------------------------------------------------------
# mutmut -- the whole shipped package carries a mutation run
#
# The Definition of Done asks for "codec and correctness layer". The scope is wider
# than that and the reason is on `do_not_mutate` below: the rule was written before
# this package held the argument-injection defence, the credential path, the
# redaction chokepoint and the fix for a reproduced RCE, and every one of those was
# outside the scope the rule names.
#
# `source_paths` is the whole package rather than a subdirectory, and that is
# load-bearing: mutmut copies source_paths into `mutants/` and then *removes* the
# real src/ from sys.path. Pointing it at `src/gantry_sftp/codec/` alone produced a
# mutants/ tree with no `gantry_sftp/__init__.py`, so `gantry_sftp` resolved as a
# namespace package containing only `codec` and every other import failed.
#
# Test selection is `tests/` and deliberately excludes `examples/`: each example
# runs as a subprocess, which imports the *installed* library rather than the
# mutated copy on the parent's sys.path. Those tests cannot kill a mutant, so
# including them would only add wall-clock.
#
# `tests/test_benchmark_harness.py` is ignored for the same reason, plus a harder
# one: it reaches `benchmarks/` by appending `Path(__file__).parent.parent /
# "benchmarks"` to sys.path, and under mutmut `__file__` is `mutants/tests/...`,
# so that resolves to a `mutants/benchmarks/` mutmut never created and collection
# dies with `ModuleNotFoundError: No module named '_harness'` before a single
# mutant runs. `--ignore` rather than `-k`, because the failure is at import
# during collection and `-k` filters after that. The alternative -- `also_copy =
# ["benchmarks/"]` -- would fix the import and then run paramiko, asyncssh and an
# sshd for every mutant; the module imports no `gantry_sftp`, so it cannot kill
# one. In `pytest_add_cli_args`, not the selection key, so it applies to the stats
# pass and the per-mutant runs alike.
# ---------------------------------------------------------------------------
[tool.mutmut]
source_paths = ["src/"]
# **The scope is a denylist, and that is D-132.** It used to be `only_mutate`, naming
# `codec/`, `session/` and `transport/` -- and an allowlist omits silently. A module added
# outside those globs was not mutated, produced no survivors, appeared in no report, and
# therefore looked exactly like a module with nothing wrong. That is not hypothetical: it
# happened three times. `transport/` was added late, by somebody noticing. `_logging.py` --
# the redaction chokepoint the Definition of Done 3 names in as many words -- was found by
# D-130, having never had a mutant. `fsspec.py`, which holds the fix for a *reproduced* remote
# code execution (D-120), and `path.py`, which holds `check_component`, were found by D-133 in
# the same sweep.
#
# Held the other way up, every absence is a statement instead of a silence: everything in
# `src/` is mutated, a new module is in the lane the day it lands, and forgetting costs
# wall-clock and a survivor list somebody has to look at rather than costing coverage and
# saying nothing. Which way the default fails is the whole of the argument.
#
# A comment saying "remember to add new modules" was refused as the fix, and so was a test
# asserting the allowlist covers every module -- that is a second place to state the scope,
# which then has to agree with the first. Inverting the default removes the need for either.
#
# Scope a working run with a wildcard rather than by editing this: `mutmut run
# "gantry_sftp.session._retry*"`. (The `session/` half of the lane was blocked upstream from
# 2026-07-26 until mutmut 3.7.0 shipped `fix(#525): implement full async-gen wrapper`; see
# D-21.)
do_not_mutate = [
    # Re-exports and a `__version__`. No function bodies, so mutmut generates nothing for it
    # either way; listed so its absence from the survivor list is a statement rather than a
    # thing nobody checked.
    "src/gantry_sftp/__init__.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["examples/"]
# `tests/test_packaging.py` is ignored for the same reason and it is worth stating
# separately, because the symptom is different: it resolves the repository root through
# `Path(__file__).parent.parent`, which under mutmut is `mutants/` -- a tree with a
# `pyproject.toml` in it and no `LICENSE`, so the licence assertions fail against a
# directory that was never meant to be a distribution. It also mutates nothing: it builds
# a wheel from the real source tree and cannot kill a codec mutant.
# `tests/test_lanes.py` is the third with the same root cause and the same shape: it loads
# `scripts/lanes.py` by path from the repository root, and `mutants/` holds only
# `source_paths`, the tests and whatever `also_copy` names -- no `scripts/`. Collection dies
# on the missing file. Same remedy, and the reason NOT to add it to `also_copy`: the module
# imports no `gantry_sftp`, so copying it in would add wall-clock and kill no mutant.
# `also_copy = ["examples/"]` is why two files are NOT in the list below, and it is the
# opposite call to `test_lanes.py`'s. `tests/test_incremental_ingest.py` (D-100) imports
# `examples/incremental_ingest.py` and drives `open_session` against a real `sftp-server`
# in-process, so its kills are real ones -- copying the directory in keeps them, where an
# ignore would have made it the sixth file whose behaviours all read as survivors. It cost
# nothing else: `examples/test_examples.py` runs each example as a *subprocess*, which
# imports the installed library rather than the mutated copy, and it is outside
# `pytest_add_cli_args_test_selection` anyway.
# `tests/test_namespace_and_connect.py` was the fourth entry in this list and is no longer
# ignored, which took two fixes rather than one. Its examples glob is answered by
# `also_copy` above. Its *second* repo-root dependency was recorded nowhere: it reached for
# `ROOT / "README.md"` only to obtain some real `stat_result`, and `Path(__file__).stat()`
# does that without leaving the file. Worth keeping as the reason a stale ignore is
# expensive -- the entry named one cause, the file had two, and under mutmut its glob
# matched nothing so the *inverse* assertion passed vacuously rather than failing.
# `tests/test_layer_discipline.py` needs no ignore but carries one `skipif` for the same
# family, added with D-118. Its hashlib rule parses every shipped module and asserts each
# `hashlib.<constructor>` call passes `usedforsecurity=False`; under mutmut `PACKAGE_ROOT`
# resolves into `mutants/`, which holds a mutated copy of every module — one variant per
# mutation, so `_session.py` runs past 36,000 lines — and flipping that keyword to `True` is an
# ordinary mutation mutmut generates. So the rule reads real mutations of a fake tree and
# reports them as offenders against source nobody ships, and stats collection stops on the
# first one. The file's other rows stay in the lane: mutations do not add forbidden imports or
# `async def`, so they pass, and none of them can kill a mutant either — every assertion here
# is on source text rather than behaviour.
# `tests/test_argv.py` needs no ignore but does carry one `skipif`, and the reason belongs
# with this list because the cause is the same family: mutmut wraps every mutated function in
# a trampoline, so the *call stack* is one frame deeper than it is outside the lane. A test
# asserting a `warnings.warn` `stacklevel` therefore measures a different thing here. It skips
# on `MUTANT_UNDER_TEST`, which mutmut sets for the whole run, so ordinary runs are unchanged.
# Without the skip the lane cannot start at all: stats collection fails on that one assertion.
# `tests/test_sync_facade.py` was the fourth entry here and is no longer ignored (D-131). It
# was the only one with a different root cause: it does not resolve the repository root, it
# introspects `Session` itself. Under mutmut the class carries the trampoline's own members --
# `xǁSessionǁ__init____mutmut_1`, `...__mutmut_orig`, one pair per mutant, 2403 of them against
# 59 real ones -- so the parity check reported several hundred imaginary "async methods with no
# blocking form" and the baseline never started.
#
# **That ignore was load-bearing in the wrong direction, which is why removing it mattered
# more than the other three.** `sync.py` is the largest module in the library and what proves
# it correct is this file, so the module that most needed the lane was excluded by the test
# that would have judged it -- and mutating it anyway would have produced a survivor list that
# was mostly the ignore. Fixed at the source: `public_members` drops names carrying mutmut's
# `__mutmut_` marker, with the reasoning and the fails-loudly argument on `MUTMUT_MARKER`
# there, plus a must-not-flag control test beside it. Ordinary runs are unchanged, because
# outside the lane it is an identity filter.
pytest_add_cli_args = [
    "--ignore=tests/test_benchmark_harness.py",
    "--ignore=tests/test_packaging.py",
    "--ignore=tests/test_lanes.py",
]
